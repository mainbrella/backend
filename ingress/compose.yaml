services:
  ingress:
    image: caddy:2.11-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?Set the certificate contact email}
      PROJECT_INGRESS_HOST: ${PROJECT_INGRESS_HOST:?Set the gateway ingress hostname}
      PROJECT_INGRESS_SECRET: ${PROJECT_INGRESS_SECRET:?Set the shared ingress secret}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ingress_data:/data
      - ingress_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  ingress_data:
  ingress_config:
