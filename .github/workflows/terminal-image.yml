name: Build MainBrella images

on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: Rebuild all images to refresh upstream packages
        type: boolean
        default: false
  schedule:
    - cron: '23 4 * * 1'
  push:
    branches: [main]
    paths:
      - containers/Dockerfile
      - containers/catalog/**
      - containers/image-catalog.js
      - scripts/catalog-images.mjs
      - scripts/publish-catalog-images.mjs
      - .github/workflows/terminal-image.yml
      - package-lock.json

permissions:
  contents: write

concurrency:
  group: terminal-image
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_ACCOUNT_ID: 2b7a9be82bb64187230703b024e25157
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Add the CLOUDFLARE_API_TOKEN Actions secret with permission to push Cloudflare container images.' >&2
            exit 1
          fi
      - name: Build, check, and push maintained images
        env:
          REBUILD_IMAGES: ${{ inputs.rebuild }}
        run: node scripts/publish-catalog-images.mjs
      - name: Publish deployment manifest
        run: |
          if ! gh release view terminal-image >/dev/null 2>&1; then
            gh release create terminal-image --target "$GITHUB_SHA" --title 'Terminal container image' --notes 'Deployment manifest for the terminal image in Cloudflare Registry.' --latest=false
          fi
          gh release upload terminal-image terminal-image.json catalog-images.json --clobber
          echo 'MainBrella catalog published. Run npm run deploy locally; Docker is not required.' >> "$GITHUB_STEP_SUMMARY"
