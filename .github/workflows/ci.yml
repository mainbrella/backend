name: Backend checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run test:openapi
      - run: npm run type-check
      - run: npm run check:containers
      - run: npm run docs:generate
      - name: Validate workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.7.12 --repo rhysd/actionlint --pattern '*linux_amd64.tar.gz' --dir "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP"/actionlint/*linux_amd64.tar.gz -C "$RUNNER_TEMP/actionlint"
          "$RUNNER_TEMP/actionlint/actionlint" -shellcheck= -pyflakes=
