name: Coordinated backend operation

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Explicit coordinated release or separate database migration
        required: true
        type: choice
        options: [release, bootstrap-activity, migrate-api, migrate-previews]
      source_sha:
        description: Full source commit SHA already merged into backend repository main
        required: true
        type: string

permissions:
  contents: read

# Shared with targeted backend deploys in this repository.
concurrency:
  group: mainbrella-backend-production
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      RELEASE_SHA: ${{ inputs.source_sha }}
      OPERATION: ${{ inputs.operation }}
      PRODUCTION_DEPLOYS_ENABLED: ${{ vars.PRODUCTION_DEPLOYS_ENABLED }}
    steps:
      - name: Require deployment ownership cutover
        run: |
          test "$PRODUCTION_DEPLOYS_ENABLED" = true || { echo 'Complete migration/CUTOVER.md before production operations.' >&2; exit 1; }
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: git merge-base --is-ancestor "$RELEASE_SHA" origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: node --check scripts/staging-config.mjs
      - name: Run only the selected operation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          IMAGE_BUILD_SECRET: ${{ secrets.IMAGE_BUILD_SECRET }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/backend-operation.mjs "$OPERATION"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-${{ inputs.operation }}-${{ inputs.source_sha }}
          path: artifacts/releases/
          if-no-files-found: ignore
          retention-days: 90
