name: Deploy one production target

on:
  workflow_dispatch:
    inputs:
      target:
        description: Worker to release
        required: true
        type: choice
        options: [api, admin, marketing, containers, previews]
      source_sha:
        description: Full source commit SHA already merged into repository main
        required: true
        type: string
      environment:
        description: Deployment environment
        required: true
        type: choice
        options: [production]

permissions:
  contents: read

concurrency:
  group: ${{ contains(fromJSON('["api","admin","marketing","containers","previews"]'), inputs.target) && 'mainbrella-backend-production' || format('mainbrella-{0}-production', inputs.target) }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      RELEASE_SHA: ${{ inputs.source_sha }}
      RELEASE_TARGET: ${{ inputs.target }}
      PRODUCTION_DEPLOYS_ENABLED: ${{ vars.PRODUCTION_DEPLOYS_ENABLED }}
    steps:
      - name: Require deployment ownership cutover
        run: |
          test "$PRODUCTION_DEPLOYS_ENABLED" = true || { echo 'Set PRODUCTION_DEPLOYS_ENABLED=true to enable manual production publishing.' >&2; exit 1; }
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'Select a full source commit SHA.' >&2; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the selected repository main history
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ contains(fromJSON('["api","admin","marketing","containers","previews"]'), inputs.target) && '24' || '22' }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Preflight and publish the selected worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          IMAGE_BUILD_SECRET: ${{ secrets.IMAGE_BUILD_SECRET }}
          GH_TOKEN: ${{ github.token }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
        run: node scripts/release.mjs "$RELEASE_TARGET" --execute
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-${{ inputs.target }}-${{ inputs.source_sha }}
          path: artifacts/releases/
          if-no-files-found: ignore
          retention-days: 90
