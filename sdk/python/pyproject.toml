[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "mainbrella"
version = "0.2.0"
description = "Mainbrella container automation client"
requires-python = ">=3.10"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Homepage = "https://mainbrella.com/docs/"
Repository = "https://github.com/mainbrella/canopy"
Issues = "https://github.com/mainbrella/canopy/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["mainbrella*"]
